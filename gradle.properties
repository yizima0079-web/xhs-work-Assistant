# ---- datapp 后端地址（app 通过它连本地后端）----
# 编译成 BuildConfig.DATAPP_BASE_URL，只当**首次启动的中性兜底**。
#
# **平时不用改这里。** 地址在 app 内改：首页「我的」→ 连接 → 修改地址（登录页也有入口，
# 防止地址填错时被锁死在登录页）。改完存在本机、重启仍生效，且支持「自动探测」在候选
# 列表里找回后端 —— 详见 app/src/main/java/com/example/datapp/ui/components/BaseUrlEditor.kt。
# 只有换了一台机器、或要改「出厂默认值」时，才需要动这一行重编。
#
#   · 模拟器 / 真机（USB 连着 adb）：http://127.0.0.1:8000 + `adb reverse tcp:8000 tcp:8000`
#   · 模拟器 / 真机（走 Wi-Fi）：    http://<电脑局域网IP>:8000
#   · 本机单元测试：                 http://127.0.0.1:8000
#
# 两条实测记录（2026-09-11 踩过，别再走一遍）：
#
# ① 局域网 IP 由 DHCP 分配，**换网络整个网段都会变**（实测 192.168.10.145 →
#    192.168.0.109）。IP 一漂，app 所有请求打到一个已不存在的主机，okhttp 拿到的是
#    「连接被静默丢弃」而不是明确拒绝，报错是 `unexpected end of stream` —— 看着像
#    后端崩了，其实后端 `/health` 一直 200，纯属找错方向。换了网络先 `ipconfig` 对一下。
#    （这条正是「地址要能在 app 里改」的起因。）
#
# ② 模拟器专用别名 `10.0.2.2` 在**本机不通**（实测 `failed to connect to /10.0.2.2
#    (port 8000) from /10.0.2.15 ... after 8000ms`，超时不是拒绝）。别拿它当"永不漂移
#    的稳定选项"。本机有 TUN 代理网卡（198.18.0.1），大概率是它或防火墙搅的。
#    （自动探测的候选列表里仍留着它 —— 换台机器可能就通了，反正并发探，不增加耗时。）
#
# 想彻底不受这两条影响，就用 `adb reverse tcp:8000 tcp:8000` 配 127.0.0.1 —— 走 adb
# 自己的 socket 转发，不碰网络栈，模拟器和 USB 真机都能用。缺点是每次 adb 断连要重跑。
datapp.baseUrl=http://127.0.0.1:8000